<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="434" viewBox="0 0 360 434" role="img" aria-labelledby="title desc">
  <title id="title">Arka's falling dot-matrix portrait</title>
  <desc id="desc">Arka's GitHub profile photo rendered as a teal dot matrix with animated falling particles.</desc>
  <defs>
    <clipPath id="avatarClip"><circle cx="180" cy="185" r="92" /></clipPath>
    <filter id="grayscale">
      <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0 0.2126 0.7152 0.0722 0 0 0.2126 0.7152 0.0722 0 0 0 0 0 1 0" />
    </filter>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.35" fill="#5eead4" />
    </pattern>
    <pattern id="dimDots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.15" fill="#5eead4" fill-opacity=".19" />
    </pattern>
    <mask id="portraitLuminance" maskUnits="userSpaceOnUse" x="88" y="93" width="184" height="184" style="mask-type:luminance">
      <rect x="88" y="93" width="184" height="184" fill="#000" />
      <image x="88" y="93" width="184" height="184" preserveAspectRatio="xMidYMid slice" filter="url(#grayscale)" href="https://avatars.githubusercontent.com/u/208900802?v=4" xlink:href="https://avatars.githubusercontent.com/u/208900802?v=4" />
    </mask>
    <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="359" height="433" rx="14" fill="#0f1620" stroke="#1f2a37" />
  <text x="32" y="38" fill="#5eead4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="1.5">ARKA / DOT MATRIX</text>

  <circle cx="180" cy="185" r="103" fill="none" stroke="#5eead4" stroke-opacity=".15" stroke-width="1">
    <animate attributeName="r" values="99;108;99" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values=".25;.05;.25" dur="3.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="180" cy="185" r="99" fill="none" stroke="url(#ringGradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="125 32 48 32 125 260">
    <animateTransform attributeName="transform" type="rotate" from="0 180 185" to="360 180 185" dur="12s" repeatCount="indefinite" />
  </circle>

  <circle cx="180" cy="185" r="92" fill="#101b26" />
  <g clip-path="url(#avatarClip)">
    <rect x="88" y="93" width="184" height="184" fill="url(#dimDots)" />
    <g mask="url(#portraitLuminance)">
      <rect x="88" y="93" width="184" height="184" fill="url(#dots)" />
    </g>
    <g fill="#a5f3fc" opacity=".8" aria-hidden="true">
      <circle cx="105" cy="0" r="1.6"><animate attributeName="cy" values="-12;290" dur="2.8s" begin="-1.6s" repeatCount="indefinite" /></circle>
      <circle cx="117" cy="0" r="1.2"><animate attributeName="cy" values="-15;290" dur="3.7s" begin="-2.4s" repeatCount="indefinite" /></circle>
      <circle cx="130" cy="0" r="1.5"><animate attributeName="cy" values="-10;290" dur="3.1s" begin="-.8s" repeatCount="indefinite" /></circle>
      <circle cx="143" cy="0" r="1.1"><animate attributeName="cy" values="-14;290" dur="4.2s" begin="-3.1s" repeatCount="indefinite" /></circle>
      <circle cx="155" cy="0" r="1.7"><animate attributeName="cy" values="-12;290" dur="2.9s" begin="-1.2s" repeatCount="indefinite" /></circle>
      <circle cx="169" cy="0" r="1.2"><animate attributeName="cy" values="-16;290" dur="3.8s" begin="-2.8s" repeatCount="indefinite" /></circle>
      <circle cx="182" cy="0" r="1.4"><animate attributeName="cy" values="-10;290" dur="3.3s" begin="-.5s" repeatCount="indefinite" /></circle>
      <circle cx="195" cy="0" r="1.1"><animate attributeName="cy" values="-12;290" dur="4.1s" begin="-2.2s" repeatCount="indefinite" /></circle>
      <circle cx="208" cy="0" r="1.6"><animate attributeName="cy" values="-15;290" dur="3.0s" begin="-1.9s" repeatCount="indefinite" /></circle>
      <circle cx="221" cy="0" r="1.2"><animate attributeName="cy" values="-11;290" dur="3.9s" begin="-3.3s" repeatCount="indefinite" /></circle>
      <circle cx="234" cy="0" r="1.5"><animate attributeName="cy" values="-14;290" dur="3.2s" begin="-1.1s" repeatCount="indefinite" /></circle>
      <circle cx="247" cy="0" r="1.1"><animate attributeName="cy" values="-12;290" dur="4.4s" begin="-2.7s" repeatCount="indefinite" /></circle>
      <circle cx="259" cy="0" r="1.6"><animate attributeName="cy" values="-10;290" dur="2.7s" begin="-.9s" repeatCount="indefinite" /></circle>
      <circle cx="113" cy="0" r="1.1"><animate attributeName="cy" values="-12;290" dur="3.6s" begin="-2.1s" repeatCount="indefinite" /></circle>
      <circle cx="150" cy="0" r="1.2"><animate attributeName="cy" values="-14;290" dur="4.0s" begin="-3.5s" repeatCount="indefinite" /></circle>
      <circle cx="201" cy="0" r="1.1"><animate attributeName="cy" values="-11;290" dur="3.5s" begin="-1.4s" repeatCount="indefinite" /></circle>
      <circle cx="240" cy="0" r="1.3"><animate attributeName="cy" values="-13;290" dur="4.3s" begin="-2.9s" repeatCount="indefinite" /></circle>
    </g>
  </g>
  <circle cx="180" cy="185" r="92" fill="none" stroke="#1f2a37" stroke-width="2" />

  <text x="180" y="326" fill="#e5e7eb" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="20" font-weight="700" text-anchor="middle">Arka Muhamad Rasyad</text>
  <text x="180" y="353" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" text-anchor="middle">Embedded Systems · IoT · Builder</text>
  <text x="180" y="397" fill="#5eead4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="1" text-anchor="middle">LEARN  /  BUILD  /  REPEAT</text>
  <style>@media (prefers-reduced-motion: reduce) { animate, animateTransform { display: none; } }</style>
</svg>
