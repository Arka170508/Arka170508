<svg xmlns="http://www.w3.org/2000/svg" width="360" height="434" viewBox="0 0 360 434" role="img" aria-labelledby="title desc">
  <title id="title">Arka's ASCII portrait</title>
  <desc id="desc">An ASCII portrait of Arka with a smooth, cascading falling-character animation.</desc>
  <style>
    .portrait-lines tspan {
      opacity: 0;
      animation: character-fall 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .portrait-lines tspan:nth-child(1) { animation-delay: 80ms; }
    .portrait-lines tspan:nth-child(2) { animation-delay: 140ms; }
    .portrait-lines tspan:nth-child(3) { animation-delay: 200ms; }
    .portrait-lines tspan:nth-child(4) { animation-delay: 260ms; }
    .portrait-lines tspan:nth-child(5) { animation-delay: 320ms; }
    .portrait-lines tspan:nth-child(6) { animation-delay: 380ms; }
    .portrait-lines tspan:nth-child(7) { animation-delay: 440ms; }
    .portrait-lines tspan:nth-child(8) { animation-delay: 500ms; }
    .portrait-lines tspan:nth-child(9) { animation-delay: 560ms; }
    .portrait-lines tspan:nth-child(10) { animation-delay: 620ms; }
    .portrait-lines tspan:nth-child(11) { animation-delay: 680ms; }
    .portrait-lines tspan:nth-child(12) { animation-delay: 740ms; }
    .portrait-lines tspan:nth-child(13) { animation-delay: 800ms; }
    .portrait-lines tspan:nth-child(14) { animation-delay: 860ms; }
    .portrait-lines tspan:nth-child(15) { animation-delay: 920ms; }
    .portrait-lines tspan:nth-child(16) { animation-delay: 980ms; }

    @keyframes character-fall {
      from {
        opacity: 0;
        transform: translateY(-18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .portrait-lines tspan {
        opacity: 1;
        animation: none;
      }
    }
  </style>
  <rect x="0.5" y="0.5" width="359" height="433" rx="14" fill="#0f1620" stroke="#1f2a37" />
  <text x="32" y="38" fill="#5eead4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="1.5">ARKA / ASCII MATRIX</text>

  <g class="portrait-lines" fill="#5eead4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="8" xml:space="preserve" text-anchor="middle">
    <text x="180" y="104">
      <tspan x="180" dy="0">:::::::.......::.......:::::::</tspan>
      <tspan x="180" dy="11.5">........................::::::</tspan>
      <tspan x="180" dy="11.5">.......:..........     ....:::</tspan>
      <tspan x="180" dy="11.5">:.........:..... .#*+.-= .=.::</tspan>
      <tspan x="180" dy="11.5">:::::::...::..--*@+:+@:.. .:.:</tspan>
      <tspan x="180" dy="11.5">:.:::::...:::.##.**++:--=#:::::</tspan>
      <tspan x="180" dy="11.5">::::::::-:::::.....==-::=*::::</tspan>
      <tspan x="180" dy="11.5">:::::::...::.......-+-=#::::::</tspan>
      <tspan x="180" dy="11.5">:::::::....--:....::::::::::=-</tspan>
      <tspan x="180" dy="11.5">::::::...--+:..::::::::.=.::.:</tspan>
      <tspan x="180" dy="11.5">:::::..:--:...:::::.::-::::.::</tspan>
      <tspan x="180" dy="11.5">..:.....:...::::::.+-::::::+=:</tspan>
      <tspan x="180" dy="11.5">===:......::::::::...:::::::++</tspan>
      <tspan x="180" dy="11.5">==-.......:-+==..:::::....:.++</tspan>
      <tspan x="180" dy="11.5">-+........-+-==:==-=-.    ...=</tspan>
    </text>
  </g>

  <text x="180" y="333" fill="#e5e7eb" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="20" font-weight="700" text-anchor="middle">Arka Muhamad Rasyad</text>
  <text x="180" y="358" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" text-anchor="middle">Embedded Systems · IoT · Builder</text>
  <text x="180" y="397" fill="#5eead4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="1" text-anchor="middle">LEARN  /  BUILD  /  REPEAT</text>
</svg>
