<svg xmlns="http://www.w3.org/2000/svg" width="520" height="434" viewBox="0 0 520 434" role="img" aria-labelledby="title desc">
  <title id="title">Arka animated system profile</title>
  <desc id="desc">An animated profile card highlighting Arka's interests in embedded systems and IoT.</desc>
  <style><![CDATA[
    @keyframes appear { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { from { transform: translateX(-520px); } to { transform: translateX(520px); } }
    .row { opacity: 0; animation: appear .65s cubic-bezier(.25,.7,.25,1) forwards; }
    .cursor { animation: blink 1.2s steps(1,end) infinite; }
    .scan { animation: scan 5s ease-in-out 1.5s infinite; }
    @media (prefers-reduced-motion: reduce) {
      .row { opacity: 1; animation: none; }
      .cursor, .scan { animation: none; }
    }
  ]]></style>
  <defs><clipPath id="scan-area"><rect x="1" y="1" width="518" height="432" rx="14"/></clipPath></defs>
  <rect x=".5" y=".5" width="519" height="433" rx="14" fill="#0f1620" stroke="#1f2a37"/>
  <g clip-path="url(#scan-area)" opacity=".1"><rect class="scan" x="0" y="0" width="90" height="434" fill="url(#scan-gradient)"/></g>
  <defs><linearGradient id="scan-gradient"><stop stop-color="#5eead4" stop-opacity="0"/><stop offset=".5" stop-color="#5eead4" stop-opacity=".55"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></linearGradient></defs>
  <text x="32" y="38" fill="#5eead4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="1.5">ARKA / SYSTEM</text>
  <text x="488" y="38" fill="#718596" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="10" text-anchor="end">PROFILE 01</text>
  <line x1="32" y1="54" x2="488" y2="54" stroke="#1f2a37"/>
  <g class="row" style="animation-delay:.15s">
    <text x="32" y="91" fill="#8194a5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="1.6">HELLO, I'M</text>
    <text x="32" y="145" fill="#e5e7eb" font-family="Inter,Arial,Helvetica,sans-serif" font-size="42" font-weight="800" letter-spacing="-2">Arka<tspan fill="#5eead4">.</tspan></text>
    <text x="34" y="171" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12">Embedded Systems · IoT · Builder</text>
  </g>
  <line x1="32" y1="194" x2="488" y2="194" stroke="#1f2a37"/>
  <g class="row" style="animation-delay:.42s"><text x="34" y="231" fill="#718596" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11">focus</text><text x="154" y="231" fill="#d5e0e8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12">Embedded systems</text><circle cx="474" cy="227" r="3" fill="#5eead4"/></g>
  <g class="row" style="animation-delay:.58s"><text x="34" y="269" fill="#718596" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11">explore</text><text x="154" y="269" fill="#d5e0e8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12">IoT · Firmware · Electronics</text><circle cx="474" cy="265" r="3" fill="#5eead4"/></g>
  <g class="row" style="animation-delay:.74s"><text x="34" y="307" fill="#718596" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11">approach</text><text x="154" y="307" fill="#d5e0e8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12">Learn · Build · Repeat</text><circle cx="474" cy="303" r="3" fill="#5eead4"/></g>
  <line x1="32" y1="344" x2="488" y2="344" stroke="#1f2a37"/>
  <g class="row" style="animation-delay:.92s"><text x="34" y="378" fill="#5eead4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12">$</text><text x="51" y="378" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12">ready to build something new</text><text x="285" y="378" fill="#5eead4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" class="cursor">▌</text></g>
  <text x="32" y="411" fill="#526476" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="9" letter-spacing="1">STATUS: ALWAYS LEARNING</text>
</svg>
