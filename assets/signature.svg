<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Arka animated signature">
  <title>Arka / signature</title>
  <style><![CDATA[
    @keyframes flow { from { stroke-dashoffset: 520 } to { stroke-dashoffset: 0 } }
    @keyframes fadeup { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes flicker { 0%, 82%, 100% { opacity: .2 } 86%, 92% { opacity: 1 } }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: .15 } }
    .wave { stroke-dasharray: 7 19; animation: flow 16s linear infinite }
    .spark { animation: flicker 6s step-end infinite }
    .label { opacity: 0; animation: fadeup .9s ease-out .15s forwards }
    .cursor { animation: blink 1.2s steps(1,end) infinite }
    @media (prefers-reduced-motion: reduce) { .wave, .spark, .label, .cursor { animation: none } .label { opacity: 1 } }
  ]]></style>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0fdfa"/><stop offset="1" stop-color="#8ca6b8"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5eead4" stop-opacity="0"/><stop offset=".5" stop-color="#5eead4" stop-opacity=".8"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x=".5" y=".5" width="899" height="239" rx="14" fill="#0f1620" stroke="#1f2a37"/>
  <text x="32" y="38" fill="#5eead4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.5">ARKA / SIGNATURE</text>
  <text x="868" y="38" text-anchor="end" fill="#718596" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1">END OF PROFILE</text>
  <line x1="32" y1="52" x2="868" y2="52" stroke="#1f2a37"/>
  <g fill="none" stroke="#5eead4" stroke-width="1.2" stroke-opacity=".3">
    <path d="M510 105c28-38 48 38 76 0s48 38 76 0 48 38 76 0 48 38 76 0"/>
    <path class="wave" d="M510 105c28-38 48 38 76 0s48 38 76 0 48 38 76 0 48 38 76 0" stroke="#5eead4" stroke-opacity=".9"/>
    <path d="M510 124c28-38 48 38 76 0s48 38 76 0 48 38 76 0 48 38 76 0" stroke-opacity=".18"/>
    <path d="M510 86c28-38 48 38 76 0s48 38 76 0 48 38 76 0 48 38 76 0" stroke-opacity=".18"/>
  </g>
  <g fill="#99f6e4">
    <circle class="spark" cx="532" cy="93" r="2"/><circle class="spark" cx="587" cy="109" r="1.5" style="animation-delay:-1.1s"/>
    <circle class="spark" cx="641" cy="91" r="1.5" style="animation-delay:-2.3s"/><circle class="spark" cx="696" cy="109" r="2" style="animation-delay:-3.2s"/>
    <circle class="spark" cx="750" cy="91" r="1.5" style="animation-delay:-4.4s"/><circle class="spark" cx="804" cy="108" r="2" style="animation-delay:-5.2s"/>
  </g>
  <g class="label">
    <text x="32" y="148" fill="url(#ink)" font-family="Inter,Arial,Helvetica,sans-serif" font-size="76" font-weight="800" letter-spacing="-4">Arka<tspan fill="#5eead4">.</tspan></text>
    <text x="35" y="171" fill="#8194a5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.2">CURIOUS BY NATURE · BUILT TO EXPLORE</text>
  </g>
  <line x1="32" y1="190" x2="868" y2="190" stroke="#1f2a37"/>
  <text x="32" y="216" fill="#718596" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10">ARKA MUHAMAD RASYAD</text>
  <text x="868" y="216" text-anchor="end" fill="#5eead4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10">KEEP BUILDING<tspan class="cursor"> ▌</tspan></text>
  <rect x="450" y="236" width="0" height="1" fill="url(#trail)"/>
</svg>